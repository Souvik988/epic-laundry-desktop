<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Epic BOS - Advanced Selling</title>
<style>
  :root{--bg:#0b0d13;--card:#141826;--ink:#eef1f7;--muted:#8b93a7;--brand:#6d8bff;--brand2:#a06bff;--ok:#3ecf8e;--warn:#ffb454;--line:#222838}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#1a2036 0%,var(--bg) 55%);color:var(--ink);min-height:100vh}
  header{padding:14px 22px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
  header a{color:var(--muted);text-decoration:none}
  main{padding:20px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px;max-width:1200px;margin:0 auto}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  h2{margin:0 0 12px;font-size:15px}
  label{display:block;color:var(--muted);font-size:12px;margin:8px 0 3px}
  input,select,textarea{width:100%;background:#0c0f18;border:1px solid #2a3145;color:var(--ink);border-radius:10px;padding:9px;font-size:14px}
  button{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;margin-top:8px}
  button.ok{background:linear-gradient(135deg,var(--ok),#2bbf7e)}button.ghost{background:#222a3c;color:var(--ink)}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:#222a3c;color:var(--muted);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .hide{display:none}
  .row{display:flex;gap:8px;margin-top:6px}
</style>
</head>
<body>
<header><a href="/ui/">- Epic BOS</a><b>Advanced Selling</b></header>
<main>
  <div class="card">
    <div class="tabs">
      <button class="on" onclick="show('qtn',this)">Quotation</button>
      <button onclick="show('so',this)">Sales Order</button>
      <button onclick="show('del',this)">Delivery Note</button>
    </div>
    <div id="qtn">
      <label>Customer</label><select id="q-cust"></select>
      <label>Valid till</label><input id="q-valid" type="date"/>
      <div id="q-items"></div>
      <button class="ghost" onclick="addRow('q-items')">+ Add item</button>
      <button class="ok" onclick="save('quotation',{customer:qcust.value,valid_till:qvalid.value,items:rows('q-items')})">Create & Submit Quotation</button>
    </div>
    <div id="so" class="hide">
      <label>Customer</label><select id="s-cust"></select>
      <label>Delivery date</label><input id="s-date" type="date"/>
      <div id="s-items"></div>
      <button class="ghost" onclick="addRow('s-items')">+ Add item</button>
      <button class="ok" onclick="save('sales_order',{customer:scust.value,delivery_date:sdate.value,items:rows('s-items')})">Create & Submit Sales Order</button>
    </div>
    <div id="del" class="hide">
      <label>Customer</label><select id="d-cust"></select>
      <label>Warehouse</label><select id="d-wh"></select>
      <label>Sales Order (optional)</label><select id="d-so"></select>
      <div id="d-items"></div>
      <button class="ghost" onclick="addRow('d-items',true)">+ Add item</button>
      <button class="ok" onclick="save('delivery_note',{customer:dcust.value,warehouse:dwh.value,sales_order:dso.value||undefined,items:rows('d-items',true)})">Create & Submit Delivery Note</button>
    </div>
  </div>
  <div class="card">
    <h2>Quotations</h2>
    <table id="qGrid"><thead><tr><th>QTN</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Sales Orders</h2>
    <table id="sGrid"><thead><tr><th>SO</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Delivery Notes</h2>
    <table id="dGrid"><thead><tr><th>DEL</th><th>Customer</th><th>Wh</th><th>Status</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script>
const KEY='';
const api=(p,o={})=>fetch('/api'+p,{headers:{'x-api-key':KEY},...o}).then(r=>r.json());
let ITEMS=[],CUST=[],WH=[],SO=[];
function show(m,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');['qtn','so','del'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!==m));}
function itemOpts(){return ITEMS.map(i=>`<option value="${i.id}">${i.data.name}</option>`).join('');}
function addRow(id,qtyOnly){const el=document.getElementById(id);el.insertAdjacentHTML('beforeend',`<div class="row"><select class="it">${itemOpts()}</select>${qtyOnly?'':'<input class="r" type="number" placeholder="rate"/>'}<input class="q" type="number" placeholder="qty"/>${qtyOnly?'':'<input class="g" type="number" placeholder="gst%" value="18"/>'}</div>`);}
function rows(id,qtyOnly){return [...document.getElementById(id).querySelectorAll('.row')].map(r=>(qtyOnly?{item:r.querySelector('.it').value,qty:Number(r.querySelector('.q').value)}:{item:r.querySelector('.it').value,qty:Number(r.querySelector('.q').value),rate:Number(r.querySelector('.r').value||0),gst_rate:Number(r.querySelector('.g').value||0)})).filter(x=>x.item&&x.qty);}
async function save(ent,data){
  if(!data.items.length){alert('Add at least one item');return;}
  const r=await api('/'+ent,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':KEY},body:JSON.stringify({data})});
  if(r.error){alert(r.error);return;}await api('/'+ent+'/'+r.id+'/submit',{method:'POST',headers:{'x-api-key':KEY}});alert(ent+' '+r.name+' created');loadGrids();
}
async function init(){
  ITEMS=await api('/item');CUST=await api('/party');WH=await api('/warehouse');SO=await api('/sales_order');
  const co=CUST.filter(p=>p.data.is_customer).map(s=>`<option value="${s.id}">${s.data.name}</option>`).join('');
  qcust.innerHTML=co;scust.innerHTML=co;dcust.innerHTML=co;
  dwh.innerHTML=WH.map(w=>`<option value="${w.id}">${w.data.name}</option>`).join('');
  dso.innerHTML='<option value="">-</option>'+SO.map(s=>`<option value="${s.id}">${s.data.name}</option>`).join('');
  addRow('q-items');addRow('s-items');addRow('d-items',true);await loadGrids();
}
async function loadGrids(){
  const q=await api('/quotation');const g=document.querySelector('#qGrid tbody');g.innerHTML='';
  for(const r of q.reverse())g.insertAdjacentHTML('beforeend',`<tr><td>${r.data.name}</td><td>${(CUST.find(c=>c.id===r.data.customer)?.data?.name)||''}</td><td>INR ${r.data.grand_total||''}</td><td>${r.status}</td></tr>`);
  const s=await api('/sales_order');const g2=document.querySelector('#sGrid tbody');g2.innerHTML='';
  for(const r of s.reverse())g2.insertAdjacentHTML('beforeend',`<tr><td>${r.data.name}</td><td>${(CUST.find(c=>c.id===r.data.customer)?.data?.name)||''}</td><td>INR ${r.data.grand_total||''}</td><td>${r.status}</td></tr>`);
  const d=await api('/delivery_note');const g3=document.querySelector('#dGrid tbody');g3.innerHTML='';
  for(const r of d.reverse())g3.insertAdjacentHTML('beforeend',`<tr><td>${r.data.name}</td><td>${(CUST.find(c=>c.id===r.data.customer)?.data?.name)||''}</td><td>${(WH.find(w=>w.id===r.data.warehouse)?.data?.name)||''}</td><td>${r.status}</td></tr>`);
}
init();
</script>
</body>
</html>
