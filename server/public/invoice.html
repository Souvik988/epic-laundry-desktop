<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Invoice</title></head>
<body style="margin:0">
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('/api/gst/print/'+id)

</script>
</body></html>
