<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Epic BOS - Multi-entity & Currency</title>
<style>
  :root{--bg:#0b0d13;--card:#141826;--ink:#eef1f7;--muted:#8b93a7;--brand:#6d8bff;--brand2:#a06bff;--ok:#3ecf8e;--warn:#ffb454;--line:#222838}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#1a2036 0%,var(--bg) 55%);color:var(--ink);min-height:100vh}
  header{padding:14px 22px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
  header a{color:var(--muted);text-decoration:none}
  main{padding:20px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px;max-width:1200px;margin:0 auto}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  h2{margin:0 0 12px;font-size:15px}
  label{display:block;color:var(--muted);font-size:12px;margin:8px 0 3px}
  input,select,textarea{width:100%;background:#0c0f18;border:1px solid #2a3145;color:var(--ink);border-radius:10px;padding:9px;font-size:14px}
  button{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;margin-top:8px}
  button.ok{background:linear-gradient(135deg,var(--ok),#2bbf7e)}button.ghost{background:#222a3c;color:var(--ink)}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:#222a3c;color:var(--muted);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .hide{display:none}
  .row{display:flex;gap:8px;margin-top:6px}
</style>
</head>
<body>
<header><a href="/ui/">- Epic BOS</a><b>Multi-entity & Currency</b></header>
<main>
  <div class="card">
    <div class="tabs">
      <button class="on" onclick="show('co',this)">Company</button>
      <button onclick="show('br',this)">Branch</button>
      <button onclick="show('ccy',this)">Currency</button>
      <button onclick="show('fx',this)">FX</button>
    </div>
    <div id="co">
      <label>Name</label><input id="c-name"/>
      <label>GSTIN</label><input id="c-gstin"/>
      <label>Default currency</label><input id="c-curr" value="INR"/>
      <button class="ok" onclick="saveCo()">Add Company</button>
    </div>
    <div id="br" class="hide">
      <label>Name</label><input id="b-name"/>
      <label>Code</label><input id="b-code"/>
      <label>Company</label><select id="b-co"></select>
      <button class="ok" onclick="saveBr()">Add Branch</button>
    </div>
    <div id="ccy" class="hide">
      <label>Code</label><input id="x-code" placeholder="USD"/>
      <label>Symbol</label><input id="x-sym" placeholder="$"/>
      <label>Rate (INR per 1 unit)</label><input id="x-rate" type="number"/>
      <button class="ok" onclick="saveCcy()">Add Currency</button>
    </div>
    <div id="fx" class="hide">
      <label>Currency</label><select id="f-code"></select>
      <label>Amount</label><input id="f-amt" type="number" value="100"/>
      <button class="ok" onclick="conv()">Convert to INR</button>
      <div id="fx-out" style="margin-top:10px;color:var(--ok)"></div>
    </div>
  </div>
  <div class="card">
    <h2>Companies</h2><table id="coGrid"><thead><tr><th>Name</th><th>GSTIN</th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Branches</h2><table id="brGrid"><thead><tr><th>Branch</th><th>Code</th><th>Company</th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Currencies</h2><table id="ccyGrid"><thead><tr><th>Code</th><th>Symbol</th><th>Rate</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script>
const KEY='';
const api=(p,o={})=>fetch('/api'+p,{headers:{'x-api-key':KEY},...o}).then(r=>r.json());
let CO=[],CCY=[];
function show(m,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');['co','br','ccy','fx'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!==m));}
async function saveCo(){const r=await api('/company',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':KEY},body:JSON.stringify({data:{name:cname.value,gstin:cgstin.value,default_currency:ccurr.value}})});if(r.error){alert(r.error);return;}await load();}
async function saveBr(){const r=await api('/branch',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':KEY},body:JSON.stringify({data:{name:bname.value,code:bcode.value,company:bco.value}})});if(r.error){alert(r.error);return;}await load();}
async function saveCcy(){const r=await api('/currency',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':KEY},body:JSON.stringify({data:{code:xcode.value,symbol:xsym.value,exchange_rate:Number(xrate.value||1)}})});if(r.error){alert(r.error);return;}await load();}
async function conv(){const r=await api('/fx/convert?code='+encodeURIComponent(fcode.value)+'&amount='+Number(famt.value||0));fxout.textContent=`${r.amount} ${r.code} = INR ${r.base} @ ${r.rate}`;}
async function init(){await load();}
async function load(){
  CO=await api('/company');CCY=await api('/currency');
  bco.innerHTML=CO.map(c=>`<option value="${c.id}">${c.data.name}</option>`).join('');
  fcode.innerHTML=CCY.map(c=>`<option value="${c.data.code}">${c.data.code}</option>`).join('');
  const cg=document.querySelector('#coGrid tbody');cg.innerHTML='';for(const r of CO.reverse())cg.insertAdjacentHTML('beforeend',`<tr><td>${r.data.name}</td><td>${r.data.gstin||''}</td></tr>`);
  const bg=document.querySelector('#brGrid tbody');bg.innerHTML='';for(const r of (await api('/branch')).reverse())bg.insertAdjacentHTML('beforeend',`<tr><td>${r.data.name}</td><td>${r.data.code}</td><td>${(CO.find(c=>c.id===r.data.company)?.data?.name)||''}</td></tr>`);
  const xg=document.querySelector('#ccyGrid tbody');xg.innerHTML='';for(const r of CCY)xg.insertAdjacentHTML('beforeend',`<tr><td>${r.data.code}</td><td>${r.data.symbol||''}</td><td>${r.data.exchange_rate}</td></tr>`);
}
init();
</script>
</body>
</html>
